[theme]
primaryColor = "#0f766e"          # Professional Deep Teal
backgroundColor = "#ffffff"       # Crisp White
secondaryBackgroundColor = "#f8fafc" # Soft Slate for Sidebar
textColor = "#0f172a"             # High-contrast Slate-900
font = "sans serif"

[client]
showErrorDetails = false          # Hides raw code tracebacks from users in production
toolbarMode = "minimal"           # Hides the Streamlit hamburger menu and deploy button

[server]
maxUploadSize = 30                # Hard cap at 30MB to protect memory
enableCORS = false
enableXsrfProtection = true