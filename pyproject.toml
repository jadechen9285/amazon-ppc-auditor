[project]
name = "startup-inventory-management"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Jianhong Chen", email = "jjianhongchen@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.2",
    "openpyxl>=3.1.5",
    "pandas>=3.0.5",
    "python-dotenv>=1.2.3",
    "scipy>=1.18.1",
    "tabulate>=0.10.0",
    "xlsxwriter>=3.2.9",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/backend", "src/ui"]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[dependency-groups]
dev = [
    "jupyterlab>=4.6.3",
    "pre-commit>=4.6.2",
    "ruff==0.16.7",
]
viz = [
    "matplotlib>=3.11.1",
    "plotly>=7.0.0",
    "seaborn>=0.13.2",
    "streamlit>=1.62.0",
    "streamlit-authenticator>=0.4.2",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# ALL rules are defined here. The IDE and pre-commit will both read this.
select = ["E", "W", "F", "I", "UP"]

# E501: Ignore line length (Ruff format handles code wrapping natively; strings shouldn't be forced)
# W293: Ignore whitespace on blank lines (prevents conflicts inside multi-line UI markdown)
ignore = ["E501", "W293"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"